<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5d50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="重點閱讀">
<title>重點閱讀 Reader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="vendor/foliate-js/vendor/pdfjs/text_layer_builder.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ 書庫 ============ -->
<section id="view-library" class="view active">
  <header class="topbar">
    <h1>我的書庫</h1>
    <div class="actions">
      <button id="btn-sync" class="icon-btn" title="Google Drive 同步">
        <svg viewBox="0 0 24 24"><path d="M19.4 10.1A7 7 0 0 0 6.1 8.1 5 5 0 0 0 6.5 18H19a4 4 0 0 0 .4-7.9z"/></svg>
        <span id="sync-dot" class="dot off"></span>
      </button>
      <button id="btn-settings" class="icon-btn" title="設定">
        <svg viewBox="0 0 24 24"><path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.3 2.9a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5z"/></svg>
      </button>
    </div>
  </header>
  <div id="sync-status" class="sync-status"></div>
  <div id="lib-tools" class="lib-tools hidden">
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 3a6.5 6.5 0 0 1 5.2 10.4l5.5 5.5-1.4 1.4-5.5-5.5A6.5 6.5 0 1 1 9.5 3zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9z"/></svg>
      <input id="lib-search" type="search" placeholder="搜尋書名、作者（簡繁皆可）" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="搜尋書庫">
      <button id="lib-search-clear" class="clear hidden" title="清除" aria-label="清除搜尋">✕</button>
    </div>
  </div>
  <main id="library-grid" class="lib-list"></main>
  <div id="library-empty" class="empty hidden">
    <p>書庫還是空的</p>
    <p class="muted">點右下角「＋」匯入電子書<br>支援 EPUB・PDF・MOBI・AZW3・TXT・DOCX・FB2</p>
  </div>
  <button id="btn-import" class="fab" title="匯入電子書">＋</button>
  <input id="file-input" type="file" multiple hidden>
  <input id="folder-input" type="file" webkitdirectory multiple hidden>
</section>

<!-- ============ 閱讀器 ============ -->
<section id="view-reader" class="view">
  <header class="topbar reader-bar">
    <button id="btn-back" class="icon-btn" title="返回書庫">
      <svg viewBox="0 0 24 24"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z"/></svg>
    </button>
    <div id="reader-title" class="reader-title"></div>
    <div class="actions">
      <button id="btn-toc" class="icon-btn" title="目錄">
        <svg viewBox="0 0 24 24"><path d="M3 5h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 6h2v2H3zm4 0h14v2H7z"/></svg>
      </button>
      <button id="btn-highlights" class="icon-btn" title="閱讀重點">
        <svg viewBox="0 0 24 24"><path d="m15.2 3.4 5.4 5.4-9.9 9.9H5.3v-5.4zM3 21h18v-1.6H3z"/></svg>
      </button>
      <button id="btn-appearance" class="icon-btn" title="字體與主題">
        <svg viewBox="0 0 24 24"><path d="M9.6 4h2.2l5.6 15h-2.3l-1.4-4H7.7l-1.4 4H4zm-1.2 9h4.6L10.7 6.5zM19 9h2v10h-2z"/></svg>
      </button>
    </div>
  </header>
  <div id="reader-scroll" class="reader-scroll">
    <div id="reader-content" class="reader-content"></div>
  </div>
  <footer class="bottombar">
    <button id="btn-prev" class="text-btn">‹ 上一章</button>
    <span id="reader-progress" class="muted"></span>
    <button id="btn-next" class="text-btn">下一章 ›</button>
  </footer>
  <div id="pdf-zoom" class="pdf-zoom hidden">
    <button id="btn-zoom-out" class="icon-btn small">－</button>
    <button id="btn-zoom-in" class="icon-btn small">＋</button>
  </div>
</section>

<!-- 選取文字後的工具列 -->
<div id="sel-toolbar" class="sel-toolbar hidden">
  <button class="swatch" data-color="yellow" title="黃色"></button>
  <button class="swatch" data-color="green" title="綠色"></button>
  <button class="swatch" data-color="blue" title="藍色"></button>
  <button class="swatch" data-color="pink" title="粉紅"></button>
  <button class="tb-btn" data-act="note">筆記</button>
  <button class="tb-btn" data-act="copy">複製</button>
</div>

<!-- 點擊已存在重點的工具列 -->
<div id="hl-toolbar" class="sel-toolbar hidden">
  <button class="swatch" data-color="yellow"></button>
  <button class="swatch" data-color="green"></button>
  <button class="swatch" data-color="blue"></button>
  <button class="swatch" data-color="pink"></button>
  <button class="tb-btn" data-act="note">筆記</button>
  <button class="tb-btn danger" data-act="delete">刪除</button>
</div>

<!-- 側邊面板（目錄 / 重點） -->
<div id="drawer-backdrop" class="backdrop hidden"></div>
<aside id="drawer" class="drawer">
  <header class="drawer-head">
    <h2 id="drawer-title"></h2>
    <button id="drawer-close" class="icon-btn">✕</button>
  </header>
  <div id="drawer-tools" class="drawer-tools"></div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>

<!-- 對話框 -->
<div id="modal-backdrop" class="backdrop hidden"></div>
<div id="modal" class="modal hidden">
  <header class="modal-head">
    <h2 id="modal-title"></h2>
    <button id="modal-close" class="icon-btn">✕</button>
  </header>
  <div id="modal-body" class="modal-body"></div>
</div>

<div id="toast" class="toast hidden"></div>
<div id="loading" class="loading hidden"><div class="spinner"></div><div id="loading-text">載入中…</div><button id="loading-stop" class="btn hidden">停止匯入</button></div>

<!-- 匯出 PDF 時使用的列印區 -->
<div id="print-area"></div>

<script src="vendor/mammoth/mammoth.browser.min.js" defer></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
